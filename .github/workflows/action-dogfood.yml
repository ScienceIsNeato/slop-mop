# Dogfood the published Marketplace action against slop-mop itself.
#
# This runs ScienceIsNeato/slop-mop-action@v2 — the exact ref consumers
# use — so we find out immediately if a slopmop release breaks the
# action's grade/SARIF/output contract. It is intentionally NOT pinned to
# a SHA: the whole point is to validate what `@v2` resolves to today.
#
# v2 installs gate tools from the committed .slopmop/required-deps.json
# (`sm doctor --required-deps`) and fails if that manifest has drifted, so
# this job also exercises the deterministic-install + drift-guard path.
#
# Mostly advisory — but with a floor. The repo's own gates
# (slopmop-sarif.yml) own finding-level enforcement, so raw scour exit
# codes don't fail this job (fail-on-failure: false) and warnings stay
# advisory. However, a FAILING gate under the action when the primary gate
# is green means the action's environment broke something — exactly what
# dogfooding exists to catch — so minimum-grade "A" fails the job on any
# failing gate rather than smiling green over a failed verdict (which
# masked a real type-blindness regression once). SARIF upload is left to
# the primary gate to avoid duplicate Code Scanning alerts.
name: Action Dogfood

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dogfood:
    name: slop-mop-action @v2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          persist-credentials: false
          # Full history: git-aware gates (diff coverage, gate-dodging)
          # resolve origin/main, matching the primary scour workflow. A
          # shallow clone makes them skip, which both diverges this grade
          # from the real gate and inflates "provisional".
          fetch-depth: 0

      # actionlint is a system tool the manifest can't install (Go binary). It's
      # applicable here (we have workflows), so provide it on PATH — otherwise
      # myopia:github-actions-hygiene warns-and-skips its actionlint pass. A real
      # consumer with workflows would do the same.
      - name: Install actionlint (for the github-actions-hygiene gate)
        run: |
          ver=1.7.12
          sha256=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ver}/actionlint_${ver}_linux_amd64.tar.gz"
          # Verify integrity against the pinned checksum before trusting the binary.
          echo "${sha256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          sudo mv actionlint /usr/local/bin/actionlint
          rm -f actionlint.tar.gz
          actionlint --version

      - id: sm
        uses: ScienceIsNeato/slop-mop-action@v2
        with:
          command: scour
          fail-on-failure: "false"
          # Grade floor: any FAILING gate (grade < A) fails this job — a
          # divergence from the green primary gate is an action-env bug.
          # Warnings (still grade A) remain advisory.
          minimum-grade: "A"
          upload-sarif: "false"
          # Type-aware gates (pyright/mypy) resolve imports against a detected
          # venv (./venv, ./.venv, or $VIRTUAL_ENV); the action installs
          # slop-mop + gate tools, not this project's deps. Provision them via
          # the action's own input so the dogfood exercises project-install on
          # every PR — the same drop-in path consumers use.
          project-install: |
            python -m venv venv
            ./venv/bin/pip install --upgrade pip
            ./venv/bin/pip install -e ".[all]"

      - name: Report hull grade
        env:
          GRADE: ${{ steps.sm.outputs.grade }}
          HULL: ${{ steps.sm.outputs.hull }}
          PROVISIONAL: ${{ steps.sm.outputs.provisional }}
        run: |
          echo "Hull grade: $GRADE — $HULL" >> "$GITHUB_STEP_SUMMARY"
          echo "grade=$GRADE hull=$HULL provisional=$PROVISIONAL"
